<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const storageKey = "thought-v2-chat-theme";
        let theme;
        try {
          const stored = window.localStorage.getItem(storageKey);
          if (stored === "light" || stored === "dark") theme = stored;
        } catch {
          // Storage can be unavailable in privacy-restricted contexts.
        }
        if (!theme) theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="icon" href="data:," />
    <title>THOUGHT V2 — Marketplace Item</title>
  </head>
  <body>
    <main id="thought-marketplace-work" class="market-work" aria-label="THOUGHT V2 marketplace item detail"></main>
    <script type="module" src="/src/thought-v2-marketplace-work-page.ts"></script>
  </body>
</html>
