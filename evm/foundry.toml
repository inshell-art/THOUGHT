[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["../node_modules"]
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
  { access = "read", path = "../protocol/current/v2" },
  { access = "read", path = "../artifacts/thought-v2-contract-release/releases/thought-v2-canonical-portable-release-20260807-r2/manifest.json" },
]
