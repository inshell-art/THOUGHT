      <circle cx="136" cy="222" r="56" fill="none" stroke="#006100" stroke-width="1"/>
      <circle cx="308" cy="222" r="56"/>
      <circle cx="480" cy="222" r="56"/>
      <circle cx="652" cy="222" r="56" fill="none" stroke="#006100" stroke-width="1"/>
      <circle cx="824" cy="222" r="56" fill="none" stroke="#006100" stroke-width="1"/>
      <circle cx="136" cy="394" r="56" fill="none" stroke="#006100" stroke-width="1"/>
      <circle cx="308" cy="394" r="56" fill="none" stroke="#006100" stroke-width="1"/>
      <circle cx="480" cy="394" r="56"/>
      <circle cx="652" cy="394" r="56" fill="none" stroke="#006100" stroke-width="1"/>
      <circle cx="824" cy="394" r="56"/>
      <circle cx="136" cy="566" r="56"/>
      <circle cx="308" cy="566" r="56" fill="none" stroke="#006100" stroke-width="1"/>
      <circle cx="480" cy="566" r="56" fill="none" stroke="#006100" stroke-width="1"/>
      <circle cx="652" cy="566" r="56" fill="none" stroke="#006100" stroke-width="1"/>
      <circle cx="824" cy="566" r="56"/>
      <circle cx="136" cy="738" r="56" fill="none" stroke="#006100" stroke-width="1"/>
    </g>

    <defs>
      <clipPath id="agent-line-clip">
        <rect x="88" y="378" width="784" height="70" rx="8"/>
      </clipPath>
      <clipPath id="prompt-line-clip">
        <rect x="166" y="868" width="628" height="44" rx="8"/>
      </clipPath>
    </defs>

    <g id="agent-line-area">
      <rect id="agent-line-bg" x="87" y="378" width="786" height="70" rx="8" fill="none" stroke="#ffffff" stroke-width="1"/>
      <text id="agent-line-text" x="480" y="413" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Noto Sans Mono', 'Noto Sans Mono CJK SC', 'Noto Sans Mono CJK JP', 'Noto Sans Mono CJK KR', 'Noto Sans', monospace, sans-serif" font-size="44" fill="#ffffff" clip-path="url(#agent-line-clip)">b</text>
    </g>

    <g id="prompt-line-area">
      <rect id="prompt-line-bg" x="165" y="868" width="630" height="44" rx="8" fill="none" stroke="#ffffff" stroke-width="1"/>
      <text id="prompt-line-text" x="480" y="890" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Noto Sans Mono', 'Noto Sans Mono CJK SC', 'Noto Sans Mono CJK JP', 'Noto Sans Mono CJK KR', 'Noto Sans', monospace, sans-serif" font-size="16" fill="#ffffff" clip-path="url(#prompt-line-clip)">a</text>
    </g>
  </g>
</svg>