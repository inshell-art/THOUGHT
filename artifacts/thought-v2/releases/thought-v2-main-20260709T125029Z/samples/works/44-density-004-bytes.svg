      <circle cx="550" cy="409" r="46"/>
      <circle cx="691" cy="409" r="46" fill="none" stroke="#006100" stroke-width="1"/>
      <circle cx="832" cy="409" r="46"/>
      <circle cx="127" cy="550" r="46"/>
      <circle cx="268" cy="550" r="46" fill="none" stroke="#006100" stroke-width="1"/>
      <circle cx="409" cy="550" r="46" fill="none" stroke="#006100" stroke-width="1"/>
      <circle cx="550" cy="550" r="46" fill="none" stroke="#006100" stroke-width="1"/>
      <circle cx="691" cy="550" r="46"/>
      <circle cx="832" cy="550" r="46" fill="none" stroke="#006100" stroke-width="1"/>
