      <circle cx="127" cy="268" r="46" fill="none" stroke="#006100" stroke-width="1"/>
      <circle cx="268" cy="268" r="46"/>
      <circle cx="409" cy="268" r="46" fill="none" stroke="#006100" stroke-width="1"/>
      <circle cx="550" cy="268" r="46"/>
